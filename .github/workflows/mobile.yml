name: RadarPL — Android APK

# Buduje aplikację mobilną (panel operatora) jako APK przez Capacitor i dołącza
# ją do wydania. Uruchamiane ręcznie z numerem wersji.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja wydania do której dołączyć APK (np. 0.1.5)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: radar/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform + sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk radar-android.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: radar/mobile/radar-android.apk
