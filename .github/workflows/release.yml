name: RadarPL — release binaries

# Na push tagu vX.Y.Z buduje binarki Windows + Ubuntu i publikuje je w GitHub
# Releases. Wbudowany auto-updater pobiera je automatycznie przy kolejnym release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja do zbudowania (np. 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries (Windows + Linux)
        working-directory: radar
        run: bash scripts/build-bin.sh "${{ steps.ver.outputs.version }}"

      - name: Checksums
        working-directory: radar/dist
        run: sha256sum radar-linux radar-windows.exe > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RadarPL v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            radar/dist/radar-linux
            radar/dist/radar-windows.exe
            radar/dist/SHA256SUMS.txt
