[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "useme-tool"
version = "0.1.0"
description = "Narzędzie do połączenia z Useme i kontroli zadań freelancera (API + checklista + pipeline zleceń)"
requires-python = ">=3.10"
dependencies = []  # tylko biblioteka standardowa

[project.scripts]
useme = "useme_tool.cli:main"

[tool.setuptools]
packages = ["useme_tool"]
